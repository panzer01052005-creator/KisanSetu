<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KisanSetu | Booking</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap topbar">
        <div>Smart slot booking • e-token generation • queue intelligence</div>
        <div class="muted">Secure and paperless</div>
      </div>
      <div class="wrap navbar">
        <div class="brand">
          <div class="brand-mark">🌾</div>
          <div>
            <h1>KisanSetu</h1>
            <small>Smart Mandis</small>
          </div>
        </div>
        <nav class="main-nav">
          <a href="index.html">Home</a>
          <a href="farmer-dashboard.html">Dashboard</a>
          <a href="booking.html" class="active">Booking</a>
          <a href="support.html">Support</a>
        </nav>
      </div>
    </header>

    <main class="wrap section">
      <div class="section-title">
        <h3>Smart slot & e-token booking</h3>
        <span class="status-pill green">3-step flow</span>
      </div>

      <div class="panel">
        <div class="form-grid">
          <div>
            <label class="label" for="bookingCrop">Crop</label>
            <select class="select" id="bookingCrop">
              <option>Wheat</option>
              <option>Paddy</option>
              <option>Mustard</option>
            </select>
          </div>
          <div>
            <label class="label" for="bookingQty">Quantity (quintals)</label>
            <input class="input" id="bookingQty" type="number" value="18" min="1" max="200" />
          </div>
          <div>
            <label class="label" for="bookingCenter">Preferred center</label>
            <select class="select" id="bookingCenter">
              <option value="PACS Manesar">PACS Manesar</option>
              <option value="Shikohpur Mandi">Shikohpur Mandi</option>
              <option value="Gurugram PACS">Gurugram PACS</option>
            </select>
          </div>
          <div>
            <label class="label" for="bookingDate">Date</label>
            <input class="input" id="bookingDate" type="date" value="2026-11-02" />
          </div>
        </div>

        <div class="panel" style="margin-top: 16px; background: #f8fbf5;">
          <label class="label">Available slots</label>
          <div class="pill-group">
            <span class="status-pill green">08:00–10:00</span>
            <span class="status-pill green">10:00–12:00</span>
            <span class="status-pill amber">12:00–14:00</span>
            <span class="status-pill grey">14:00–16:00</span>
          </div>
        </div>

        <div class="cta-row" style="margin-top: 18px;">
          <button class="primary-btn" id="bookTokenBtn">Create e-token</button>
          <a class="ghost-btn" href="farmer-dashboard.html">Back to dashboard</a>
        </div>
        <div class="alert success" id="bookingMessage"></div>
      </div>
    </main>

    <script>
      const bookTokenBtn = document.getElementById('bookTokenBtn');
      const bookingMessage = document.getElementById('bookingMessage');

      bookTokenBtn.addEventListener('click', async () => {
        const payload = {
          farmer_name: 'Rahul Singh',
          crop: document.getElementById('bookingCrop').value,
          est_weight: `${document.getElementById('bookingQty').value || 18} qtl`,
          slot_date: document.getElementById('bookingDate').value || '2026-11-02'
        };

        try {
          const response = await fetch('/api/v1/tokens/book', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const result = await response.json();

          if (!response.ok) throw new Error(result.message || 'Booking failed');

          bookingMessage.textContent = `Booking confirmed. Token ${result.data.tokenId} created for ${document.getElementById('bookingCenter').value}.`;
          bookingMessage.className = 'alert success';
        } catch (error) {
          bookingMessage.textContent = error.message || 'Unable to create e-token.';
          bookingMessage.className = 'alert error';
        }
      });
    </script>
  </body>
</html>
