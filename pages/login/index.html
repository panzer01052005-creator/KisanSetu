<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to KisanSetu as a farmer or buyer.">
  <title>Login | KisanSetu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="../../assets/site.js" defer></script>
</head>
<body>
  <main class="login-page">
    <a class="brand" href="../home/index.html" aria-label="KisanSetu home"><span class="brand-mark" aria-hidden="true"><i></i><b></b></span><span>Kisan<span>Setu</span></span></a>

    <section class="login-card" aria-labelledby="login-title">
      <div class="card-heading">
        <p class="eyebrow">Welcome</p>
        <h1 id="login-title">Access your account</h1>
        <p>Choose how you want to continue.</p>
      </div>

      <div class="auth-toggle" role="tablist" aria-label="Authentication options">
        <button class="auth-toggle-btn active" type="button" data-auth-mode="login" aria-selected="true">Log in</button>
        <button class="auth-toggle-btn" type="button" data-auth-mode="signup" aria-selected="false">Sign up</button>
      </div>

      <div class="auth-panel active" id="login-panel" role="tabpanel" aria-label="Login form">
        <form class="login-form" action="#dashboard" method="get">
          <label for="mobile">Mobile number or email</label>
          <input id="mobile" name="mobile" type="text" placeholder="Enter mobile number or email" required>

          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" placeholder="Enter your password" required>

          <button type="submit">Continue <span>→</span></button>
        </form>
      </div>

      <div class="auth-panel" id="signup-panel" role="tabpanel" aria-label="Sign up form" hidden>
        <form class="login-form signup-form" action="#dashboard" method="get">
          <label for="full-name">Full name</label>
          <input id="full-name" name="fullName" type="text" placeholder="Enter your full name" required>

          <label for="signup-email">Email address</label>
          <input id="signup-email" name="email" type="email" placeholder="Enter your email" required>

          <label for="signup-mobile">Mobile number</label>
          <input id="signup-mobile" name="mobile" type="tel" placeholder="Enter your mobile number" required>

          <label for="signup-password">Password</label>
          <input id="signup-password" name="password" type="password" placeholder="Create a password" required>

          <button type="submit">Create account <span>→</span></button>
        </form>
      </div>

      <p class="terms">Secure login for the KisanSetu community.</p>
    </section>

    <p class="support-note">Need help signing in? <a href="#help">Contact support</a></p>
  </main>
</body>
</html>
