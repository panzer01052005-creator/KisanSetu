<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to KisanSetu as a farmer or buyer.">
  <title>Login | KisanSetu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="../../assets/site.js" defer></script>
</head>
<body>
  <main class="login-page">
    <a class="brand" href="../home/index.html" aria-label="KisanSetu home"><span class="brand-mark" aria-hidden="true"><i></i><b></b></span><span>Kisan<span>Setu</span></span></a>

    <div class="header-actions login-page-actions">
      <label class="language-field" aria-label="Language selector">
        <span class="sr-only">Language</span>
        <select class="language-select" aria-label="Select language">
          <option value="en">English</option>
          <option value="as">অসমীয়া</option>
          <option value="bn">বাংলা</option>
          <option value="brx">बोड़ो</option>
          <option value="doi">डोगरी</option>
          <option value="gu">ગુજરાતી</option>
          <option 
value="hi">हिन्दी</option>
          <option value="ka">ಕನ್ನಡ</option>
          <option value="ks">कश्मीरी</option>
          <option value="kok">कोंकणी</option>
          <option value="mai">मैथिली</option>
          <option value="ml">മലയാളം</option>
          <option value="mni">মণিপুরি</option>
          <option value="mr">मराठी</option>
          <option value="ne">नेपाली</option>
          <option value="or">ଓଡ଼ିଆ</option>
          <option value="pa">ਪੰਜਾਬੀ</option>
          <option value="sa">संस्कृत</option>
          <option value="sat">संताली</option>
          <option value="sd">سنڌي</option>
          <option value="ta">தமிழ்</option>
          <option value="te">తెలుగు</option>
          <option 
value="ur">اردو</option>
        </select>
      </label>
    </div>

    <section class="login-card" aria-labelledby="login-title">
      <div class="card-heading">
        <p class="eyebrow" data-i18n="auth.welcome">Welcome</p>
        <h1 id="login-title" data-i18n="auth.title">Access your account</h1>
        <p data-i18n="auth.subtitle">Choose how you want to continue.</p>
      </div>

      <div class="auth-toggle" role="tablist" aria-label="Authentication options">
        <button class="auth-toggle-btn active" type="button" data-auth-mode="login" aria-selected="true" data-i18n="auth.login">Log in</button>
        <button class="auth-toggle-btn" type="button" data-auth-mode="signup" aria-selected="false" data-i18n="auth.signup">Sign up</button>
      </div>

      <div class="auth-panel active" id="login-panel" role="tabpanel" aria-label="Login form">
        <div class="language-picker">
          <label for="login-language">Language</label>
          <select id="login-language" name="language">
            <option value="en">English</option>
            <option value="as">অসমীয়া</option>
            <option value="bn">বাংলা</option>
            <option value="brx">बोड़ो</option>
            <option value="doi">डोगरी</option>
            <option value="gu">ગુજરાતી</option>
            <option value="hi">हिन्दी</option>
            <option value="ka">ಕನ್ನಡ</option>
            <option value="ks">कश्मीरी</option>
            <option value="kok">कोंकणी</option>
            <option value="mai">मैथिली</option>
            <option value="ml">മലയാളം</option>
            <option value="mni">মণিপুরি</option>
            <option value="mr">मराठी</option>
            <option value="ne">नेपाली</option>
            <option value="or">ଓଡ଼ିଆ</option>
            <option value="pa">ਪੰਜਾਬੀ</option>
            <option value="sa">संस्कृत</option>
            <option value="sat">संताली</option>
            <option value="sd">سنڌي</option>
            <option value="ta">தமிழ்</option>
            <option value="te">తెలుగు</option>
            <option value="ur">اردو</option>
          </select>
        </div>

        <form class="login-form" action="../dashboard/index.html" method="get">
          <input type="hidden" name="role" value="seller">
          <label for="mobile" data-i18n="auth.mobile">Mobile number or email</label>
          <input id="mobile" name="mobile" type="text" placeholder="Enter mobile number or email" data-i18n-placeholder="auth.mobilePlaceholder" required>

          <label for="login-password" data-i18n="auth.password">Password</label>
          <input id="login-password" name="password" type="password" placeholder="Enter your password" data-i18n-placeholder="auth.passwordPlaceholder" required>

          <button type="submit" data-i18n="auth.continue">Continue <span>→</span></button>
        </form>
      </div>

      <div class="auth-panel" id="signup-panel" role="tabpanel" aria-label="Sign up form" hidden>
        <div class="role-choice" aria-label="Choose account type">
          <button class="role-btn active" type="button" data-role="seller" aria-pressed="true">Seller</button>
          <button class="role-btn" type="button" data-role="buyer" aria-pressed="false">Buyer</button>
        </div>

        <div class="language-picker">
          <label for="signup-language">Language</label>
          <select id="signup-language" name="language">
            <option value="en">English</option>
            <option value="as">অসমীয়া</option>
            <option value="bn">বাংলা</option>
            <option value="brx">बोड़ो</option>
            <option value="doi">डोगरी</option>
            <option value="gu">ગુજરાતી</option>
            <option value="hi">हिन्दी</option>
            <option value="ka">ಕನ್ನಡ</option>
            <option value="ks">कश्मीरी</option>
            <option value="kok">कोंकणी</option>
            <option value="mai">मैथिली</option>
            <option value="ml">മലയാളം</option>
            <option value="mni">মণিপুরি</option>
            <option value="mr">मराठी</option>
            <option value="ne">नेपाली</option>
            <option value="or">ଓଡ଼ିଆ</option>
            <option value="pa">ਪੰਜਾਬੀ</option>
            <option value="sa">संस्कृत</option>
            <option value="sat">संताली</option>
            <option value="sd">سنڌي</option>
            <option value="ta">தமிழ்</option>
            <option value="te">తెలుగు</option>
            <option value="ur">اردو</option>
          </select>
        </div>

        <form class="login-form signup-form" action="../dashboard/index.html" method="get">
          <input type="hidden" name="role" value="seller">
          <label for="full-name" data-i18n="auth.fullName">Full name</label>
          <input id="full-name" name="fullName" type="text" placeholder="Enter your full name" data-i18n-placeholder="auth.fullNamePlaceholder" required>

          <label for="signup-email" data-i18n="auth.email">Email address</label>
          <input id="signup-email" name="email" type="email" placeholder="Enter your email" data-i18n-placeholder="auth.emailPlaceholder" required>

          <label for="signup-mobile" data-i18n="auth.mobileNumber">Mobile number</label>
          <input id="signup-mobile" name="mobile" type="tel" placeholder="Enter your mobile number" data-i18n-placeholder="auth.mobileNumberPlaceholder" required>

          <label for="signup-password" data-i18n="auth.password">Password</label>
          <input id="signup-password" name="password" type="password" placeholder="Create a password" data-i18n-placeholder="auth.createPasswordPlaceholder" required>

          <button type="submit" data-i18n="auth.createAccount">Create account <span>→</span></button>
        </form>
      </div>

      <p class="terms">Secure login for the KisanSetu community.</p>
    </section>

    <p class="support-note">Need help signing in? <a href="#help">Contact support</a></p>
  </main>
</body>
</html>
