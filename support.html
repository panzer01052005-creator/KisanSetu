<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KisanSetu | Support</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap topbar">
        <div>Help desk • grievance redressal • IVR support</div>
        <div class="muted">Fast action with SLA tracking</div>
      </div>
      <div class="wrap navbar">
        <div class="brand">
          <div class="brand-mark">🌾</div>
          <div>
            <h1>KisanSetu</h1>
            <small>Smart Mandis</small>
          </div>
        </div>
        <nav class="main-nav">
          <a href="index.html">Home</a>
          <a href="farmer-dashboard.html">Dashboard</a>
          <a href="booking.html">Booking</a>
          <a href="support.html" class="active">Support</a>
        </nav>
      </div>
    </header>

    <main class="wrap section">
      <div class="section-title">
        <h3>Help, IVR & grievance desk</h3>
      </div>

      <div class="ticket-grid">
        <div class="panel">
          <form id="grievanceForm" novalidate>
            <div class="form-grid">
              <div>
                <label class="label" for="grievanceMobile">Farmer Mobile Number</label>
                <input class="input" id="grievanceMobile" type="tel" maxlength="10" placeholder="Enter 10-digit mobile number" />
              </div>
              <div>
                <label class="label" for="grievanceTokenId">Token ID (Optional)</label>
                <input class="input" id="grievanceTokenId" placeholder="KSM-40188" />
              </div>
              <div>
                <label class="label" for="grievanceCenter">Procurement Center</label>
                <select class="select" id="grievanceCenter">
                  <option value="">Select center</option>
                  <option>PACS Manesar</option>
                  <option>Shikohpur Mandi</option>
                  <option>Gurugram PACS</option>
                </select>
              </div>
              <div>
                <label class="label" for="grievanceCategory">Issue Category</label>
                <select class="select" id="grievanceCategory">
                  <option value="">Select issue category</option>
                  <option>Weighing Discrepancy</option>
                  <option>Unfair Quality Rejection</option>
                  <option>Delayed Payment</option>
                  <option>Officer Misconduct</option>
                  <option>Other</option>
                </select>
              </div>
              <div>
                <label class="label" for="grievanceImage">Image Upload</label>
                <input class="input" id="grievanceImage" type="file" accept="image/*" />
              </div>
              <div>
                <label class="label" for="grievanceVoice">Voice Note Upload</label>
                <input class="input" id="grievanceVoice" type="file" accept="audio/*" />
              </div>
              <div style="grid-column: 1 / -1;">
                <label class="label" for="grievanceDescription">Description</label>
                <textarea class="textarea" id="grievanceDescription" placeholder="Describe the issue, lot details, and timeline"></textarea>
              </div>
            </div>
            <div class="cta-row" style="margin-top: 18px;">
              <button class="primary-btn" id="submitTicketBtn" type="submit">Submit grievance</button>
            </div>
            <div class="alert" id="ticketFeedback" aria-live="polite"></div>
          </form>
        </div>

        <div class="panel">
          <div class="section-title"><h3>Ticket SLA tracker</h3></div>
          <form id="ticketStatusForm" novalidate>
            <div class="form-grid">
              <div style="grid-column: 1 / -1;">
                <label class="label" for="ticketIdInput">Ticket ID</label>
                <input class="input" id="ticketIdInput" placeholder="MSD-123456" />
              </div>
              <div style="grid-column: 1 / -1;">
                <label class="label" for="ticketMobileInput">Registered mobile number</label>
                <input class="input" id="ticketMobileInput" type="tel" maxlength="10" placeholder="Enter mobile used during submission" />
              </div>
            </div>
            <div class="cta-row">
              <button class="ghost-btn" type="submit">Check ticket status</button>
            </div>
          </form>

          <div id="ticketStatusResult" class="panel" style="margin-top: 16px; background: #f8fbf5;">
            <strong>Ticket status appears here</strong>
            <div class="muted small">Enter a valid ticket ID and mobile number to view the current status.</div>
          </div>
        </div>
      </div>
    </main>

    <script>
      const grievanceForm = document.getElementById('grievanceForm');
      const ticketFeedback = document.getElementById('ticketFeedback');

      grievanceForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const payload = {
          farmerMobile: document.getElementById('grievanceMobile').value.trim(),
          tokenId: document.getElementById('grievanceTokenId').value.trim(),
          centerName: document.getElementById('grievanceCenter').value,
          issueCategory: document.getElementById('grievanceCategory').value,
          description: document.getElementById('grievanceDescription').value.trim(),
          imageName: document.getElementById('grievanceImage').files[0]?.name || null,
          voiceNoteName: document.getElementById('grievanceVoice').files[0]?.name || null
        };

        if (!/^\d{10}$/.test(payload.farmerMobile)) {
          ticketFeedback.textContent = 'Please enter a valid 10-digit mobile number.';
          ticketFeedback.className = 'alert error';
          return;
        }

        if (!payload.centerName || !payload.issueCategory || !payload.description) {
          ticketFeedback.textContent = 'Please complete center, issue category, and description.';
          ticketFeedback.className = 'alert error';
          return;
        }

        try {
          const response = await fetch('/api/v1/support/tickets', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const result = await response.json();

          if (!response.ok) throw new Error(result.message || 'Submission failed');

          const ticket = result.data;
          ticketFeedback.textContent = `Ticket submitted successfully. Reference: ${ticket.ticketId}. SLA: ${ticket.slaHours} hours.`;
          ticketFeedback.className = 'alert success';
          document.getElementById('ticketIdInput').value = ticket.ticketId;
          document.getElementById('ticketMobileInput').value = payload.farmerMobile;
          grievanceForm.reset();
        } catch (error) {
          ticketFeedback.textContent = error.message || 'Unable to submit grievance right now.';
          ticketFeedback.className = 'alert error';
        }
      });

      document.getElementById('ticketStatusForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const ticketId = document.getElementById('ticketIdInput').value.trim();
        const mobile = document.getElementById('ticketMobileInput').value.trim();
        const resultNode = document.getElementById('ticketStatusResult');

        try {
          const response = await fetch(`/api/v1/support/tickets/${encodeURIComponent(ticketId)}?mobile=${encodeURIComponent(mobile)}`);
          const payload = await response.json();

          if (!response.ok || !payload.success) throw new Error(payload.message || 'Status unavailable');

          const ticket = payload.data;
          resultNode.innerHTML = `
            <strong>Ticket ${ticket.ticketId}</strong>
            <div class="muted small">Submitted: ${new Date(ticket.createdAt).toLocaleString()}</div>
            <div class="list-row"><span>Issue</span><strong>${ticket.issueCategory}</strong></div>
            <div class="list-row"><span>Status</span><strong>${ticket.status}</strong></div>
            <div class="list-row"><span>Assigned department</span><strong>${ticket.assignedDepartment}</strong></div>
            <div class="list-row"><span>SLA deadline</span><strong>${new Date(ticket.slaDeadline).toLocaleString()}</strong></div>
          `;
        } catch (error) {
          resultNode.innerHTML = `<strong>Status unavailable</strong><div class="muted small">${error.message}</div>`;
        }
      });
    </script>
  </body>
</html>
